name: CI - Tracking Logistico Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: trackingLogisticoEap11

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Give execution permission to Maven wrapper
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B test
        env:
          SPRING_PROFILES_ACTIVE: test

  build:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: trackingLogisticoEap11

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Give execution permission to Maven wrapper
        run: chmod +x mvnw

      - name: Build package
        run: ./mvnw -B package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackinglogistico-backend-jar
          path: trackingLogisticoEap11/target/*.jar

  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: trackingLogisticoEap11

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Give execution permission to Maven wrapper
        run: chmod +x mvnw

      - name: Analyze with SonarCloud
        run: >
          ./mvnw -B verify sonar:sonar
          -Dsonar.projectKey=EAP-11-trackingLogistico_tackingLogisticoBackEnd
          -Dsonar.organization=eap-11-trackinglogistico
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPRING_PROFILES_ACTIVE: test
